name: Register plugin in database

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      DATABASE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag
        required: true
        default: v0.1.0-preview.16
        type: string

permissions:
  contents: read

concurrency:
  group: zashboard-database
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update database channel
        env:
          DATABASE_REPOSITORY: ${{ vars.DATABASE_REPOSITORY }}
          GH_TOKEN: ${{ secrets.DATABASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -z "$GH_TOKEN" || -z "$DATABASE_REPOSITORY" ]]; then
            echo "Database registration skipped: configure DATABASE_TOKEN and DATABASE_REPOSITORY." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/submit_database.py "$RELEASE_TAG"
